<div id="adminDashboardPage" style="display:none;">

    <div class="card">

        <div style="text-align:center;">

            <h2>🛡️ Admin Dashboard</h2>

            <p style="
                color:#666;
                margin-bottom:25px;">

                Welcome,
                <strong id="adminName"></strong>

            </p>

        </div>

        <!-- Dashboard Statistics -->

        <div class="dashboard-grid">

            <div class="dashboard-card">

                <h3 id="pendingCount">0</h3>

                <p>🟡 Pending</p>

            </div>

            <div class="dashboard-card">

                <h3 id="reviewCount">0</h3>

                <p>🔵 Under Review</p>

            </div>

            <div class="dashboard-card">

                <h3 id="approvedCount">0</h3>

                <p>🟢 Approved</p>

            </div>

            <div class="dashboard-card">

                <h3 id="rejectedCount">0</h3>

                <p>🔴 Rejected</p>

            </div>

        </div>

        <!-- Loader -->

        <div
            id="adminLoader"
            class="loader">
        </div>

        <!-- Action Buttons -->

        <button

            class="loginButton"

            onclick="startReview()">

            ▶️ Start Review

        </button>

        <button

            class="secondaryButton"

            onclick="refreshDashboard()">

            🔄 Refresh Dashboard

        </button>

        <button

            class="logoutButton"

            onclick="logout()">

            🚪 Logout

        </button>

    </div>

</div>
